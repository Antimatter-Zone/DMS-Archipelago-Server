name: type check

on:
  pull_request:
    paths:
      - "**.py"
      - ".github/pyright-config.json"
      - ".github/workflows/strict-type-check.yml"
      - "**.pyi"
  push:
    paths:
      - "**.py"
      - ".github/pyright-config.json"
      - ".github/workflows/strict-type-check.yml"
      - "**.pyi"

permissions: {}

jobs:
  pyright:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/codex/public-disposable-beta') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/public-disposable-beta')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip pyright==1.1.392.post0
          python ModuleUpdate.py --append "WebHostLib/requirements.txt" --force --yes

      - name: "pyright: strict check on specific files"
        run: python .github/type_check.py
